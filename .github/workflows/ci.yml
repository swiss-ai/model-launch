name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  workflow_dispatch:

jobs:
  static-checks:
    uses: ./.github/workflows/static.yml

  detect-changes:
    needs: [static-checks]
    name: Catalog-only Change Detection
    # Draft PRs run static checks only; skip the heavier test pipeline.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      catalog_only: ${{ steps.catalog.outputs.catalog_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect catalog-only changes
        id: catalog
        run: |
          # A model PR (model-launch-factory, or a person) adds a catalog entry
          # (assets/models.json), an mfa_examples/ folder, the env TOML the entry
          # points at (assets/envs/) and sometimes the image that env needs
          # (images/<name>/Dockerfile). None of that is launcher code, so the
          # integration test tiers below have nothing to test and would just burn
          # real FirecREST/SLURM time. Images are built by the
          # swiss-ai/model-launch-images repository, not here. Any file outside
          # these paths (src/, tests/, the workflows, …) flips catalog_only to false.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED=""  # manual dispatch always runs full CI
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}" "${{ github.sha }}")
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
              CHANGED=""  # first push to branch; can't diff, don't assume catalog-only
            else
              CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
            fi
          fi

          CATALOG_ONLY=true
          if [ -z "$CHANGED" ]; then
            CATALOG_ONLY=false
          else
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                mfa_examples/*) ;;
                src/swiss_ai_model_launch/assets/models.json) ;;
                src/swiss_ai_model_launch/assets/envs/*.toml) ;;
                images/*/Dockerfile) ;;
                *) CATALOG_ONLY=false ;;
              esac
            done <<< "$CHANGED"
          fi
          echo "catalog_only=$CATALOG_ONLY" >> "$GITHUB_OUTPUT"
          echo "Catalog-only change: $CATALOG_ONLY"

  test-lightweight:
    name: Integration Tests (lightweight)
    needs: [detect-changes]
    if: |
      github.event.pull_request.draft != true &&
      needs.detect-changes.outputs.catalog_only != 'true' &&
      github.event_name != 'workflow_dispatch' &&
      !contains(github.event.pull_request.labels.*.name, 'requires-std-tests') &&
      !contains(github.event.pull_request.labels.*.name, 'requires-comprehensive-tests')
    runs-on: ubuntu-latest
    env:
      SML_SWISSAI_RESEARCH_API_KEY: ${{ secrets.SML_SWISSAI_RESEARCH_API_KEY }}
      SML_FIRECREST_API_KEY: ${{ secrets.SML_FIRECREST_API_KEY }}
      SML_SYSTEM: ${{ vars.SML_SYSTEM }}
      SML_FIRECREST_URL: ${{ vars.SML_FIRECREST_URL }}
      SML_PARTITION: ${{ vars.SML_PARTITION }}
      SML_RESERVATION: ${{ vars.SML_RESERVATION }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          python-version: "3.12"
      - run: make _test-lightweight

  test-std:
    name: Integration Tests (std)
    needs: [detect-changes]
    if: |
      github.event.pull_request.draft != true &&
      needs.detect-changes.outputs.catalog_only != 'true' &&
      contains(github.event.pull_request.labels.*.name, 'requires-std-tests') &&
      !contains(github.event.pull_request.labels.*.name, 'requires-comprehensive-tests')
    runs-on: ubuntu-latest
    env:
      SML_SWISSAI_RESEARCH_API_KEY: ${{ secrets.SML_SWISSAI_RESEARCH_API_KEY }}
      SML_FIRECREST_API_KEY: ${{ secrets.SML_FIRECREST_API_KEY }}
      SML_SYSTEM: ${{ vars.SML_SYSTEM }}
      SML_FIRECREST_URL: ${{ vars.SML_FIRECREST_URL }}
      SML_PARTITION: ${{ vars.SML_PARTITION }}
      SML_RESERVATION: ${{ vars.SML_RESERVATION }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          python-version: "3.12"
      - run: make _test-std

  test-comprehensive:
    name: Integration Tests (comprehensive)
    needs: [detect-changes]
    if: |
      github.event.pull_request.draft != true &&
      needs.detect-changes.outputs.catalog_only != 'true' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'requires-comprehensive-tests'))
    runs-on: ubuntu-latest
    env:
      SML_SWISSAI_RESEARCH_API_KEY: ${{ secrets.SML_SWISSAI_RESEARCH_API_KEY }}
      SML_FIRECREST_API_KEY: ${{ secrets.SML_FIRECREST_API_KEY }}
      SML_SYSTEM: ${{ vars.SML_SYSTEM }}
      SML_FIRECREST_URL: ${{ vars.SML_FIRECREST_URL }}
      SML_PARTITION: ${{ vars.SML_PARTITION }}
      SML_RESERVATION: ${{ vars.SML_RESERVATION }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          python-version: "3.12"
      - run: make _test-comprehensive
