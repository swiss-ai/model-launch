# Native vLLM connector configuration. The local service uses 8 GiB of RAM.
kv_transfer_config:
  kv_connector: LMCacheMPConnector
  kv_connector_module_path: lmcache.integration.vllm.lmcache_mp_connector
  kv_role: kv_both
  kv_connector_extra_config:
    lmcache.mp.host: 127.0.0.1
    lmcache.mp.port: 15555
    lmcache.mp.autostart: true
    lmcache.mp.autostart.server_args: >-
      --l1-size-gb 8 --eviction-policy LRU --chunk-size 256 --http-port 8081
