# Shared ARM64 image: vLLM with LMCache 0.5.6, validated on Clariden GH200.
image = "/capstor/store/cscs/swissai/infra01/container-images/examples/vllm_cuda13-lmcache-0.5.6-arm64.sqsh"
mounts = ["/capstor/store/cscs/swissai/infra01/opentela-share:/opentelabin", "/capstor", "/iopsstor"]
workdir = "/opt"

[env]
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
VLLM_ALLREDUCE_USE_SYMM_MEM = "0"
VLLM_ALLREDUCE_USE_FLASHINFER = "0"
VLLM_ALLREDUCE_USE_FLASHINFER_PCIE_IPC = "0"
